name: Build & release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn requests pyinstaller
          pip install netifaces-plus
          pip install python-miio --no-deps
          pip install "PyYAML>=5,<7" android_backup appdirs attrs "click>=8" "construct>=2.10.56,<3" croniter cryptography defusedxml pytz tqdm "zeroconf<1"
          pip install micloud --no-deps

      - name: Build exe
        run: python build.py

      - name: Smoke test
        shell: pwsh
        run: |
          $env:MIHOME_NO_BROWSER = "1"
          $p = Start-Process dist\MiHomeAPI.exe -ArgumentList 8123 -PassThru
          Start-Sleep 12
          $r = Invoke-RestMethod http://127.0.0.1:8123/api/session
          Stop-Process $p -Force
          if ($r.app -ne "mihome-api") { throw "smoke test failed" }

      - uses: actions/upload-artifact@v4
        with:
          name: MiHomeAPI-windows
          path: dist/MiHomeAPI.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MiHomeAPI.exe
          generate_release_notes: true
